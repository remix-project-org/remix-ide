name: Image Alt Text Check

on:
  pull_request:
    branches: ["master"]
    paths:
      - "docs/**"
jobs:
  check-image-alt-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run image alt text check
        run: node docs/scripts/check-image-alt-text.js
